<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خرید فصل — ریاضی دوم با فیلی</title><meta name="description" content="آموزش تعاملی ریاضی دوم دبستان با فیلی؛ انیمیشن، بازی و تمرین.">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"><script src="config.js"></script><script src="access.js"></script><script src="site.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script><script src="backend.js"></script></head>
<body class="site page-sky"><div id="nav"></div><div class="doc" id="bx" style="text-align:center">در حال بارگذاری…</div>
<script>
(async()=>{const n=+new URLSearchParams(location.search).get('ch'),c=CHAPTERS.find(x=>x.n===n),bx=document.getElementById('bx');
if(!c){location.replace('chapters.html');return}if(c.free){location.replace('ch'+c.n+'.html');return}
const {data:st}=await sb.from('settings').select('key,value'),P=Object.fromEntries((st||[]).map(x=>[x.key,+x.value])),owned=await myEntitlements();
if(owned.has(n)){location.replace('chapter.html?n='+n);return}
bx.innerHTML=`<div style="background:${c.c};color:#fff;border-radius:22px;padding:16px;margin-bottom:14px"><div style="font-size:28px;font-weight:800">${lockSvg().replace('class="lockb"','style="width:34px;height:40px;vertical-align:middle;margin-inline-end:8px"')}فصل ${fa(c.n)}: ${c.t}</div></div>
<img src="a/fili.png" alt="فیلی" style="height:150px"><h2>این فصل قفل است</h2><p>در این فصل این درس‌ها را یاد می‌گیری:</p><ul style="display:inline-block;text-align:start">${c.lessons.map(l=>'<li>'+l+'</li>').join('')}</ul>
<div id="er" class="notice" style="display:none"></div>
<p class="cta" style="justify-content:center"><button class="btn3d" id="b1">🛒 خرید این فصل — ${P.price_chapter_rial?money(P.price_chapter_rial):''}</button><button class="btn3d b-green" id="b2">🎁 خرید همه فصل‌های قفل‌دار — ${P.price_bundle_rial?money(P.price_bundle_rial):''}</button></p>
<p class="cta" style="justify-content:center"><a class="btn3d b-blue" href="chapters.html">↩ بازگشت به صفحه فصل‌ها</a></p>`;
const go=async(body,btn)=>{const er=document.getElementById('er');er.style.display='none';await requireLogin();btn.disabled=true;
 try{const r=await api('/create-order',{method:'POST',body:JSON.stringify(body)});location.href=r.url}catch(e){er.textContent=e.message;er.style.display='block';btn.disabled=false}};
document.getElementById('b1').onclick=e=>go({kind:'chapter',chapter_n:n},e.target);document.getElementById('b2').onclick=e=>go({kind:'bundle'},e.target);})();
</script><div id="ft"></div>
