<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"><script src="config.js"></script><script src="access.js"></script><script src="site.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script><script src="backend.js"></script></head>
<body class="site page-sky"><div id="nav"></div>

<script>
const C=[[40,402],[414,766],[779,1136],[1148,1503]],R=[[350,633],[646,958]],P=document.getElementById('pic');
CHAPTERS.forEach((c,i)=>{const[x1,x2]=C[i%4],[y1,y2]=R[i/4|0],a=document.createElement('a');a.className='h'+(c.free?'':' locked');a.href=chapterUrl(c.n);
a.title=c.free?'فصل '+fa(c.n)+': '+c.t:'فصل '+fa(c.n)+': '+c.t+' — قفل است؛ برای اطلاعات خرید کلیک کن';a.setAttribute('aria-label',a.title);

myEntitlements().then(own=>{if(!own.size)return;
document.querySelectorAll('#pic a.h.locked').forEach((a,i)=>{const n=+a.href.split('ch=')[1];if(own.has(n)){a.classList.remove('locked');a.href='chapter.html?n='+n;a.innerHTML='';a.title='فصل '+fa(n)+' — باز است'}});

</script></body></html>
